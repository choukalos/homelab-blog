<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GALAGA — Deep Space Combat</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Courier New',monospace;}canvas{display:block;}#crt{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.1) 0px,rgba(0,0,0,0.1) 1px,transparent 1px,transparent 3px);}#crt::after{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,0.4) 100%);}#hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:20px;z-index:5;color:#0fa;font-size:14px;font-weight:bold;text-shadow:0 0 10px #0fa;letter-spacing:1px;}#hud span{background:rgba(0,0,10,0.7);padding:5px 12px;border-radius:4px;}#lives-panel{position:absolute;left:16px;top:10px;z-index:5;text-align:left;}#lives-panel .title{color:#0fa;font-size:11px;text-shadow:0 0 6px #0fa;}#lives-icons{display:flex;gap:3px;margin-top:4px;}.life-icon{width:20px;height:14px;}#overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;z-index:20;pointer-events:none;}#overlay>div{background:rgba(0,5,15,0.94);border:2px solid #0fa;border-radius:8px;padding:32px 48px;text-align:center;color:#0fa;font-family:'Courier New',monospace;text-shadow:0 0 8px #0fa;max-width:540px;box-shadow:0 0 60px rgba(0,255,170,0.12);}#overlay h2{font-size:32px;margin-bottom:4px;letter-spacing:4px;}#overlay h3{font-size:15px;margin:12px 0 6px;color:#0fa;letter-spacing:2px;}#overlay p{font-size:13px;margin:4px 0;color:#8cc;line-height:1.5;}.c-yellow{color:#ff0 !important;text-shadow:0 0 6px #ff0 !important;}.c-green{color:#0f0 !important;}.c-red{color:#f44 !important;text-shadow:0 0 6px #f44 !important;}.c-amber{color:#fa0 !important;}.c-cyan{color:#0fa !important;}.c-white{color:#fff !important;}.c-pink{color:#f6a !important;text-shadow:0 0 6px #f6a !important;}</style></head><body><div id="crt"></div><div id="hud"><span id="uScore">SCORE: 0</span><span id="uHigh">HI: 0</span><span id="uWave">WAVE 1</span><span id="uAliens">ALIENS: 0</span></div><div id="lives-panel"><div class="title">LIVES</div><div id="lives-icons"></div></div><canvas id="c"></canvas><div id="overlay"><div id="msgBox"><h2>👾 GALAGA</h2><p class="c-cyan" style="font-size:15px; margin:4px 0;">DEEP SPACE COMBAT</p><h3>CONTROLS</h3><p><span class="c-yellow">← →</span> Move &nbsp; <span class="c-yellow">↑ ↓</span> Thrust &nbsp; <span class="c-yellow">SPACE</span> Fire</p><h3>ENEMIES</h3><p><span class="c-green">BEE</span> 50pts &nbsp; <span class="c-red">BUTTERFLY</span> 100pts &nbsp; <span class="c-cyan">BOSS</span> 200pts</p><p><span class="c-yellow">GALAGA</span> Final Boss — 1000pts</p><p style="margin-top:14px;">Press <span class="c-yellow">SPACE</span> to start</p></div></div><script>const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');function resize(){canvas.width=Math.min(window.innerWidth-100,800);canvas.height=Math.min(window.innerHeight-20,640);canvas.width=Math.max(480,canvas.width);canvas.height=Math.max(400,canvas.height);}resize();window.addEventListener('resize',resize);let audioCtx;function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}function playSound(type){ensureAudio();const ac=audioCtx,now=ac.currentTime;try{switch(type){case 'shoot':{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.setValueAtTime(880,now);o.frequency.exponentialRampToValueAtTime(440,now+0.06);g.gain.setValueAtTime(0.1,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.06);o.connect(g).connect(ac.destination);o.start(now);o.stop(now+0.06);break;}case 'explosion':{const buf=ac.createBuffer(1,ac.sampleRate*0.3,ac.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();s.buffer=buf;f.type='lowpass';f.frequency.setValueAtTime(800,now);f.frequency.exponentialRampToValueAtTime(60,now+0.3);g.gain.setValueAtTime(0.3,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.3);s.connect(f).connect(g).connect(ac.destination);s.start(now);s.stop(now+0.3);break;}case 'bigBoom':{const buf=ac.createBuffer(1,ac.sampleRate*0.7,ac.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5);const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();s.buffer=buf;f.type='lowpass';f.frequency.setValueAtTime(500,now);f.frequency.exponentialRampToValueAtTime(30,now+0.7);g.gain.setValueAtTime(0.5,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.7);s.connect(f).connect(g).connect(ac.destination);s.start(now);s.stop(now+0.7);break;}case 'hit':{const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(200,now);o.frequency.exponentialRampToValueAtTime(40,now+0.3);g.gain.setValueAtTime(0.25,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.3);o.connect(g).connect(ac.destination);o.start(now);o.stop(now+0.3);break;}case 'warn':{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=900;g.gain.setValueAtTime(0.08,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.06);o.connect(g).connect(ac.destination);o.start(now);o.stop(now+0.06);break;}case 'wave':{[440,554,659,880].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.12,now+i*0.08);g.gain.exponentialRampToValueAtTime(0.001,now+i*0.08+0.12);o.connect(g).connect(ac.destination);o.start(now+i*0.08);o.stop(now+i*0.08+0.12);});break;}}}catch(e){}}const SW=32,SH=24;const AW=24,AH=20;const BW=4,BH=10;const ABW=4,ABH=6;const MAX_LIVES=5;const TOTAL_WAVES=8;const T_BEE=0,T_FLY=1,T_BOSS=2,T_GALAGA=3;const PTS=[50,100,200,1000];const HP=[1,2,3,12];const CLR=['#0f0','#f44','#48f','#fd0'];let keys={};let ship=null;let pBullets=[],aBullets=[],aliens=[],explosions=[],particles=[];let stars=[];let score=0,hiScore=parseInt(localStorage.getItem('galaga_hi')||'0');let wave=0,lives=MAX_LIVES;let gameOver=false,gameStarted=false;let wavePhase='none',waveTimer=0;let fmx=0,fmy=60;let shakeT=0,shakeI=0;function R(a,b){return a+Math.random()*(b-a);}function D(a,b){return Math.hypot(b.x-a.x,b.y-a.y);}function L(a,b,t){return a+(b-a)*t;}function C(v,lo,hi){return Math.max(lo,Math.min(hi,v));}function initStars(){stars=[];for(let i=0;i<100;i++)stars.push({x:R(0,canvas.width),y:R(0,canvas.height),r:R(0.4,1.5),s:R(0.3,1.8),p:R(0,6.28)});}initStars();function tickStars(){stars.forEach(s=>{s.y+=s.s;s.p+=0.03;if(s.y>canvas.height+5){s.y=-5;s.x=R(0,canvas.width);}});}function initGame(){const w=canvas.width,h=canvas.height;ship={x:w/2,y:h-40,by:h-40,alive:true,flash:0,cd:0};score=0;wave=0;lives=MAX_LIVES;gameOver=false;gameStarted=true;pBullets=[];aBullets=[];aliens=[];explosions=[];particles=[];wavePhase='none';waveTimer=0;fmx=w/2;fmy=60;shakeT=0;shakeI=0;nextWave();hideMsg();hud();}function nextWave(){wave++;if(wave>TOTAL_WAVES){gameOver=true;if(score>hiScore){hiScore=score;localStorage.setItem('galaga_hi',score);}showMsg(`<h2 class="c-yellow">👾 VICTORY!</h2><p>You defeated GALAGA!</p><p>Score:<span class="c-yellow">${score}</span></p><p style="margin-top:14px;">Press<span class="c-yellow">SPACE</span>to play again</p>`);return;}wavePhase='enter';waveTimer=150;aBullets=[];aliens=[];if(wave===TOTAL_WAVES){buildFinal();}else{buildWave();}playSound('wave');hud();}function buildWave(){const cols=C(4+Math.floor(wave/2),4,8);const rows=C(2+Math.floor(wave/3),2,4);for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){let t=r===0?T_BOSS:(r<=1?T_FLY:T_BEE);const gap=C(64,80,canvas.width-60);const ox=(c-(cols-1)/2)*(gap/Math.max(cols-1,1));aliens.push({t:t,ox:ox,oy:r*50,x:fmx+ox,y:-30-R(0,50),st:'enter',hp:HP[t],mhp:HP[t],wp:R(0,6.28),bt:0});}}}function buildFinal(){aliens.push({t:T_GALAGA,ox:0,oy:0,x:canvas.width/2,y:-50,st:'enter',hp:HP[T_GALAGA],mhp:HP[T_GALAGA],wp:0,bt:0,isBoss:true});for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2;aliens.push({t:i%2===0?T_FLY:T_BEE,ox:Math.cos(a)*100,oy:Math.sin(a)*55,x:canvas.width/2+Math.cos(a)*100,y:-30-R(0,60),st:'enter',hp:HP[i%2===0?T_FLY:T_BEE],mhp:HP[i%2===0?T_FLY:T_BEE],wp:R(0,6.28),bt:0,orbit:a});}}function shipFire(){if(!ship||!ship.alive||ship.cd>0)return;ship.cd=10;pBullets.push({x:ship.x,y:ship.y-SH/2,vy:-8});playSound('shoot');}function killAlien(a){a.st='dead';a.hp=0;score+=PTS[a.t];shakeT=10;shakeI=a.t===T_GALAGA?8:4;playSound(a.t===T_GALAGA?'bigBoom':'explosion');const n=a.t===T_GALAGA?25:10;for(let i=0;i<n;i++)particles.push({x:a.x,y:a.y,vx:R(-3,3),vy:R(-3,3),r:R(1,a.t===T_GALAGA?5:3),life:30,max:30,c:CLR[a.t]});explosions.push({x:a.x,y:a.y,r:a.t===T_GALAGA?8:4,life:a.t===T_GALAGA?40:20,max:a.t===T_GALAGA?40:20,big:a.t===T_GALAGA});}function hitShip(){if(!ship||!ship.alive||ship.flash>0)return;ship.alive=false;ship.flash=50;lives--;shakeT=15;shakeI=6;playSound('hit');for(let i=0;i<12;i++)particles.push({x:ship.x,y:ship.y,vx:R(-4,4),vy:R(-3,2),r:R(1,3),life:25,max:25,c:'#0fa'});explosions.push({x:ship.x,y:ship.y,r:4,life:20,max:20});if(lives<=0){gameOver=true;if(score>hiScore){hiScore=score;localStorage.setItem('galaga_hi',score);}setTimeout(()=>showMsg(`<h2 class="c-red">GAME OVER</h2><p>Score:<span class="c-yellow">${score}</span></p><p>High:<span class="c-cyan">${hiScore}</span></p><p style="margin-top:12px;">Press<span class="c-yellow">SPACE</span>to retry</p>`),600);}else{setTimeout(()=>{if(ship){ship.alive=true;ship.x=canvas.width/2;ship.y=ship.by;ship.flash=30;}},1200);}}function collide(){if(!ship)return;pBullets=pBullets.filter(b=>{let hit=false;for(let a of aliens){if(a.st==='dead')continue;if(Math.abs(b.x-a.x)<AW/2+BW/2&&Math.abs(b.y-a.y)<AH/2+BH/2){a.hp--;if(a.hp<=0)killAlien(a);hit=true;break;}}return!hit&&b.y>-10;});if(ship.alive&&ship.flash<=0){aBullets=aBullets.filter(b=>{if(Math.abs(b.x-ship.x)<SW/2+ABW/2&&Math.abs(b.y-ship.y)<SH/2+ABH/2){hitShip();return false;}return b.y<canvas.height+20;});}if(ship.alive&&ship.flash<=0){for(let a of aliens){if(a.st==='dead'||a.st==='enter')continue;if(D(a,ship)<(AW+SW)/2-4){a.hp-=2;if(a.hp<=0)killAlien(a);hitShip();break;}}}}function update(){if(!gameStarted||gameOver||!ship){tickStars();return;}tickStars();if(wavePhase==='enter'){waveTimer--;const prog=1-waveTimer/150;aliens.forEach((a,i)=>{const st=(i % 10)*0.04;const p=C((prog-st)/(1-st),0,1);if(a.isBoss){a.x=fmx+a.ox+Math.sin(p*Math.PI*2)*30*(1-p);a.y=L(-50,fmy+a.oy,p);}else if(a.orbit!==undefined){a.orbit+=0.01;a.x=fmx+Math.cos(a.orbit)*80;a.y=fmy+Math.sin(a.orbit)*40;}else{a.x=fmx+a.ox+Math.sin(p*Math.PI*3)*15*(1-p);a.y=L(-30,fmy+a.oy,p);}});if(waveTimer<=0){wavePhase='fight';}return;}if(wavePhase==='fight'){fmx=canvas.width/2+Math.sin(Date.now()*0.0008)*30;let alive=0;for(let a of aliens){if(a.st==='dead')continue;alive++;a.wp+=0.08;if(a.st!=='dive'){if(a.isBoss){a.x=fmx+a.ox+Math.sin(Date.now()*0.003)*15;a.y=fmy+a.oy+Math.sin(Date.now()*0.002)*8;}else if(a.orbit!==undefined){a.orbit+=0.015;a.x=fmx+Math.cos(a.orbit)*100+Math.sin(Date.now()*0.003)*12;a.y=fmy+Math.sin(a.orbit)*55+Math.sin(Date.now()*0.002)*6;}else{a.x=fmx+a.ox+Math.sin(Date.now()*0.002+a.ox*0.02)*3;a.y=fmy+a.oy+Math.sin(Date.now()*0.0015+a.oy*0.03)*2;}if(Math.random()<0.0008*wave){a.st='dive';a.dt=0;a.dx=R(40,canvas.width-40);a.dy=canvas.height+20;}if(Math.random()<(a.t===T_BOSS?0.004:a.t===T_FLY?0.002:0.001)){const dx=ship.x-a.x,dy=ship.y-a.y;const l=Math.hypot(dx,dy)||1;const sp=1.8+wave*0.12;aBullets.push({x:a.x,y:a.y+AH/2,vx:(dx/l)*sp,vy:(dy/l)*sp});}}else{a.dt++;a.y+=2.5;a.x+=Math.sin(a.dt*0.08)*2.5;if(a.dt>15&&Math.random()<0.02){const dx=ship.x-a.x,dy=ship.y-a.y;const l=Math.hypot(d illStyle='rgba(255,0,0,0.04)';ctx.fillRect(0,h-60,w,60);ctx.fillStyle='#0ff';ctx.shadowColor='#0ff';ctx.shadowBlur=5;pBullets.forEach(b=>{ctx.fillRect(b.x-BW/2,b.y-BH/2,BW,BH);});ctx.shadowBlur=0;ctx.fillStyle='#f44';ctx.shadowColor='#f44';ctx.shadowBlur=4;aBullets.forEach(b=>{ctx.fillRect(b.x-ABW/2,b.y-ABH/2,ABW,ABH);});ctx.shadowBlur=0;aliens.forEach(a=>{if(a.st==='dead')return;ctx.save();ctx.translate(a.x,a.y);const c=CLR[a.t];ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=a.t===T_GALAGA?14:6;if(a.t===T_BEE){ctx.beginPath();ctx.ellipse(0,0,AW/2,AH/2,0,0,6.28);ctx.fill();ctx.globalAlpha=0.4;const wy=Math.sin(a.wp)*5;ctx.beginPath();ctx.ellipse(-AW/3,-wy,7,4,-0.3,0,6.28);ctx.fill();ctx.beginPath();ctx.ellipse(AW/3,-wy,7,4,0.3,0,6.28);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-4,-2,2,0,6.28);ctx.arc(4,-2,2,0,6.28);ctx.fill();}else if(a.t===T_FLY){const wa=Math.sin(a.wp)*0.4;ctx.beginPath();ctx.moveTo(0,AH/2);ctx.lineTo(-AW/2,0);ctx.lineTo(-AW/3,-AH/2);ctx.lineTo(AW/3,-AH/2);ctx.lineTo(AW/2,0);ctx.closePath();ctx.fill();ctx.globalAlpha=0.35;ctx.beginPath();ctx.ellipse(-AW/2-5,0,9,7,wa,0,6.28);ctx.fill();ctx.beginPath();ctx.ellipse(AW/2+5,0,9,7,-wa,0,6.28);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-4,-2,3,0,6.28);ctx.arc(4,-2,3,0,6.28);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-4,-2,1.5,0,6.28);ctx.arc(4,-2,1.5,0,6.28);ctx.fill();}else if(a.t===T_BOSS){ctx.beginPath();for(let i=0;i<6;i++){const ang=(i/6)*6.28-1.57;const r=i%2===0?AW/2:AW/3;ctx.lineTo(Math.cos(ang)*r,Math.sin(ang)*r);}ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.globalAlpha=0.35;ctx.beginPath();ctx.arc(0,0,4,0,6.28);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(-4,-2,3,0,6.28);ctx.arc(4,-2,3,0,6.28);ctx.fill();}else if(a.t===T_GALAGA){const s=1.8;ctx.beginPath();ctx.moveTo(-AW/2*s,AH/4*s);ctx.lineTo(-AW/2*s,-AH/2*s);ctx.lineTo(-AW/4*s,-AH/2*s-10);ctx.lineTo(0,-AH/2*s);ctx.lineTo(AW/4*s,-AH
