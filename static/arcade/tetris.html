<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TETRIS — Deep Space Edition</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Courier New',monospace;}canvas{display:block;}#crt{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.1) 0px,rgba(0,0,0,0.1) 1px,transparent 1px,transparent 3px);}#crt::after{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,0.4) 100%);}#side-panel{position:absolute;top:50%;right:40px;transform:translateY(-50%);z-index:5;color:#0fa;text-align:right;}#side-panel .label{font-size:11px;letter-spacing:2px;margin:12px 0 4px;text-shadow:0 0 6px #0fa;}#side-panel .value{font-size:22px;font-weight:bold;text-shadow:0 0 10px #0fa;}#next-canvas{border:1px solid #333;margin-top:6px;}#lives-panel{position:absolute;left:16px;top:10px;z-index:5;}#lives-panel .title{color:#0fa;font-size:11px;text-shadow:0 0 6px #0fa;}#lives-icons{display:flex;gap:3px;margin-top:4px;}.life-icon{width:16px;height:12px;}#overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;z-index:20;pointer-events:none;}#overlay>div{background:rgba(0,5,15,0.94);border:2px solid #0fa;border-radius:8px;padding:32px 48px;text-align:center;color:#0fa;text-shadow:0 0 8px #0fa;max-width:500px;box-shadow:0 0 60px rgba(0,255,170,0.12);}#overlay h2{font-size:32px;margin-bottom:4px;letter-spacing:4px;}#overlay h3{font-size:15px;margin:12px 0 6px;color:#0fa;letter-spacing:2px;}#overlay p{font-size:13px;margin:4px 0;color:#8cc;line-height:1.5;}.c-yellow{color:#ff0 !important;text-shadow:0 0 6px #ff0 !important;}.c-green{color:#0f0 !important;}.c-red{color:#f44 !important;text-shadow:0 0 6px #f44 !important;}.c-cyan{color:#0fa !important;}.c-amber{color:#fa0 !important;}</style></head><body><div id="crt"></div><div id="side-panel"><div class="label">SCORE</div><div class="value" id="uScore">0</div><div class="label">HI</div><div class="value" id="uHi">0</div><div class="label">LEVEL</div><div class="value" id="uLevel">1</div><div class="label">LINES</div><div class="value" id="uLines">0</div><div class="label">NEXT</div><canvas id="next-canvas" width="100" height="100"></canvas></div><canvas id="c"></canvas><div id="overlay"><div id="msgBox"><h2>🟦 TETRIS</h2><p class="c-cyan" style="font-size:14px; margin:4px 0;">DEEP SPACE EDITION</p><h3>CONTROLS</h3><p><span class="c-yellow">← →</span> Move &nbsp; <span class="c-yellow">↑</span> Rotate &nbsp; <span class="c-yellow">↓</span> Soft Drop &nbsp; <span class="c-yellow">SPACE</span> Hard Drop</p><p><span class="c-yellow">P / ESC</span> Pause</p><h3>SCORING</h3><p>1 Line: 100 &nbsp; 2 Lines: 300 &nbsp; 3 Lines: 500 &nbsp; <span class="c-yellow">TETRIS: 800</span></p><p>Score × Level multiplier!</p><p style="margin-top:12px;">Press <span class="c-yellow">SPACE</span> to start</p></div></div><script>const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');const nCanvas=document.getElementById('next-canvas');const nCtx=nCanvas.getContext('2d');function resize(){const maxW=Math.min(window.innerWidth-240,600);const cw=Math.max(360,maxW);const ch=cw*1.5;canvas.width=cw;canvas.height=ch;}resize();window.addEventListener('resize',resize);let audioCtx;function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}function playSound(type){ensureAudio();const ac=audioCtx,now=ac.currentTime;try{switch(type){case 'move':{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=220;g.gain.setValueAtTime(0.04,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.03);o.connect(g).connect(ac.destination);o.start(now);o.stop(now+0.03);break;}case 'rotate':{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(330,now);o.frequency.exponentialRampToValueAtTime(440,now+0.05);g.gain.setValueAtTime(0.06,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.05);o.connect(g).connect(ac.destination);o.start(now);o.stop(now+0.05);break;}case 'drop':{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.setValueAtTime(150,now);o.frequency.exponentialRampToValueAtTime(50,now+0.15);g.gain.setValueAtTime(0.15,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.15);o.connect(g).connect(ac.destination);o.start(now);o.stop(now+0.15);break;}case 'clear':{[523,659,784].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(0.1,now+i*0.06);g.gain.exponentialRampToValueAtTime(0.001,now+i*0.06+0.1);o.connect(g).connect(ac.destination);o.start(now+i*0.06);o.stop(now+i*0.06+0.1);});break;}case 'tetris':{[523,659,784,1047].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(0.15,now+i*0.08);g.gain.exponentialRampToValueAtTime(0.001,now+i*0.08+0.15);o.connect(g).connect(ac.destination);o.start(now+i*0.08);o.stop(now+i*0.08+0.15);});break;}case 'gameover':{[440,370,311,261].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.value=f;g.gain.setValueAtTime(0.12,now+i*0.15);g.gain.exponentialRampToValueAtTime(0.001,now+i*0.15+0.2);o.connect(g).connect(ac.destination);o.start(now+i*0.15);o.stop(now+i*0.15+0.2);});break;}case 'levelup':{[440,554,659,880,1108].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.1,now+i*0.05);g.gain.exponentialRampToValueAtTime(0.001,now+i*0.05+0.1);o.connect(g).connect(ac.destination);o.start(now+i*0.05);o.stop(now+i*0.05+0.1);});break;}}}catch(e){}}const COLS=10,ROWS=20;const PIECES=[{name:'I',color:'#0ff',cells:[[0,0],[1,0],[2,0],[3,0]]},{name:'O',color:'#ff0',cells:[[0,0],[1,0],[0,1],[1,1]]},{name:'T',color:'#a0f',cells:[[0,0],[1,0],[2,0],[1,1]]},{name:'S',color:'#0f0',cells:[[1,0],[2,0],[0,1],[1,1]]},{name:'Z',color:'#f00',cells:[[0,0],[1,0],[1,1],[2,1]]},{name:'J',color:'#00f',cells:[[0,0],[0,1],[1,1],[2,1]]},{name:'L',color:'#f80',cells:[[2,0],[0,1],[1,1],[2,1]]}];const LINES_PER_LEVEL=10;const SCORES=[0,100,300,500,800];let grid=[];let board=[];let cur=null;let next=null;let score=0,hiScore=parseInt(localStorage.getItem('tetris_hi')||'0');let level=1,totalLines=0,lives=3;let gameOver=false,gameStarted=false,paused=false;let dropTimer=0,dropInterval=1000;let lineClearRows=[],lineClearTimer=0;let shakeT=0,shakeI=0;let stars=[];let keys={};let lastTime=0;let bag=[];let lockTimer=0,lockLimit=500;function R(a,b){return a+Math.random()*(b-a);}function initStars(){stars=[];for(let i=0;i<60;i++)stars.push({x:R(0,canvas.width),y:R(0,canvas.height),r:R(0.3,1),s:R(0.2,1),p:R(0,6.28)});}initStars();function tickStars(){stars.forEach(s=>{s.y+=s.s;s.p+=0.02;if(s.y>canvas.height+5){s.y=-5;s.x=R(0,canvas.width);}});}function initGame(){grid=[];board=[];for(let y=0;y<ROWS;y++){board[y]=[];for(let x=0;x<COLS;x++)board[y][x]=null;}score=0;level=1;totalLines=0;lives=3;gameOver=false;gameStarted=true;paused=false;dropTimer=0;dropInterval=1000;lineClearRows=[];lineClearTimer=0;shakeT=0;shakeI=0;bag=[];lockTimer=0;next=spawnPiece();cur=spawnPiece();hud();hideMsg();}function fillBag(){const b=PIECES.map((_,i)=>i);for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}function spawnPiece(){if(bag.length===0)bag=fillBag();const idx=bag.pop();const tpl=PIECES[idx];const cells=tpl.cells.map(c=>[c[0],c[1]]);return{cells:cells,color:tpl.color,x:Math.floor(COLS/2)-1,y:0};}function rotatePiece(p){let minCx=Infinity,maxCx=-Infinity,minCy=Infinity,maxCy=-Infinity;p.cells.forEach(c=>{minCx=Math.min(minCx,c[0]);maxCx=Math.max(maxCx,c[0]);minCy=Math.min(minCy,c[1]);maxCy=Math.max(maxCy,c[1]);});const cx=(minCx+maxCx)/2;const cy=(minCy+maxCy)/2;const newCells=p.cells.map(c=>{const dx=c[0]-cx,dy=c[1]-cy;return[Math.round(cx-dy+0.01),Math.round(cy+dx+0.01)];});return newCells;}function collides(cells,ox,oy){for(const[cx,cy]of cells){const x=cx+ox,y=cy+oy;if(x<0||x>=COLS||y>=ROWS)return true;if(y>=0&&board[y][x])return true;}return false;}function lockPiece(){for(const[cx,cy]of cur.cells){const x=cx+cur.x,y=cy+cur.y;if(y<0){gameOver=true;if(score>hiScore){hiScore=score;localStorage.setItem('tetris_hi',hiScore);}playSound('gameover');setTimeout(()=>showMsg(`<h2 class="c-red">GAME OVER</h2><p>Score:<span class="c-yellow">${score}</span></p><p>Level:${level}|Lines:${totalLines}</p><p>High:<span class="c-cyan">${hiScore}</span></p><p style="margin-top:12px;">Press<span class="c-yellow">SPACE</span>to retry</p>`),500);return;}board[y][x]=cur.color;}playSound('drop');lineClearRows=[];for(let y=0;y<ROWS;y++){if(board[y].every(c=>c!==null))lineClearRows.push(y);}if(lineClearRows.length>0){lineClearTimer=25;if(lineClearRows.length===4)playSound('tetris');else playSound('clear');shakeT=12;shakeI=lineClearRows.length===4?6:3;score+=SCORES[lineClearRows.length]*level;totalLines+=lineClearRows.length;const newLevel=Math.floor(totalLines/LINES_PER_LEVEL)+1;if(newLevel>level){level=newLevel;dropInterval=Math.max(100,1000-(level-1)*80);playSound('levelup');}}else{cur=next;next=spawnPiece();if(collides(cur.cells,cur.x,cur.y)){gameOver=true;if(score>hiScore){hiScore=score;localStorage.setItem('tetris_hi',hiScore);}playSound('gameover');setTimeout(()=>showMsg(`<h2 class="c-red">GAME OVER</h2><p>Score:<span class="c-yellow">${score}</span></p><p>Level:${level}|Lines:${totalLines}</p><p style="margin-top:12px;">Press<span class="c-yellow">SPACE</span>to retry</p>`),500);}}hud();}function hardDrop(){while(!collides(cur.cells,cur.x,cur.y+1)){cur.y++;score+=2;}lockPiece();hud();}function ghostY(){let gy=cur.y;while(!collides(cur.cells,cur.x,gy+1))gy++;return gy;}window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();if(e.key===' '&&(!gameStarted||gameOver)){initGame();return;}if(e.key==='p'||e.key==='P'||e.key==='Escape'){if(gameStarted&&!gameOver)paused=!paused;if(paused)showMsg(`<h2 class="c-cyan">PAUSED</h2><p>Press<span class="c-yellow">ESC</span>or<span class="c-yellow">P</span>to resume</p>`);else hideMsg();return;}});window.addEventListener('keyup',e=>{keys[e.key]=false;});let moveDelay=0,moveTimer=0;function handleInput(dt){if(!cur||paused||gameOver)return;moveTimer+=dt;if(moveTimer>170||moveDelay>0){const rate=moveDelay>0?50:130;if(moveTimer>rate){moveTimer=0;if(keys['ArrowLeft']){if(!collides(cur.cells,cur.x-1,cur.y)){cur.x--;playSound('move');}}if(keys['ArrowRight']){if(!collides(cur.cells,cur.x+1,cur.y)){cur.x++;playSound('move');}}}}if(keys['ArrowLeft']||keys['ArrowRight']){if(moveDelay===0)moveDelay=1;}else moveDelay=0;if(keys['ArrowUp']&&moveTimer>100){moveTimer=0;const newCells=rotatePiece(cur);for(const kick of[0,-1,1,-2,2]){if(!collides(newCells,cur.x+kick,cur.y)){cur.cells=newCells;cur.x+=kick;playSound('rotate');break;}}}if(keys['ArrowDown']){if(moveTimer>50){moveTimer=0;if(!collides(cur.cells,cur.x,cur.y+1)){cur.y++;score+=1;}}}if(keys[' ']){hardDrop();moveTimer=0;}}function update(dt){if(!gameStarted||gameOver||paused){tickStars();return;}tickStars();handleInput(dt);if(lineClearTimer>0){lineClearTimer--;if(lineClearTimer<=0){for(const row of lineClearRows.sort((a,b)=>b-a)){board.splice(row,1);board.unshift(new Array(COLS).fill(null));}lineClearRows=[];cur=next;next=spawnPiece();if(collides(cur.cells,cur.x,cur.y)){gameOver=true;if(score>hiScore){hiScore=score;localStorage.setItem('tetris_hi',hiScore);}playSound('gameover');setTimeout(()=>showMsg(`<h2 class="c-red">GAME OVER</h2><p>Score:<span class="c-yellow">${score}</span></p><p>Level:${level}|Lines:${totalLines}</p><p style="margin-top:12px;">Press<span class="c-yellow">SPACE</span>to retry</p>`),500);}hud();}return;}if(cur){dropTimer+=dt;if(dropTimer>dropInterval){dropTimer=0;if(!collides(cur.cells,cur.x,cur.y+1)){cur.y++;}else{lockPiece();dropTimer=0;}}}if(shakeT>0)shakeT--;}function draw(){const w=canvas.width,h=canvas.height;const cellW=w/COLS,cellH=(h-40)/ROWS;const offX=0,offY=20;ctx.save();if(shakeT>0)ctx.translate(Math.random()*shakeI-shakeI/2,Math.random()*shakeI-shakeI/2);const bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#020810');bg.addColorStop(0.5,'#051018');bg.addColorStop(1,'#081020');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);stars.forEach(s=>{ctx.globalAlpha=0.2+0.2*Math.sin(s.p);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill();});ctx.globalAlpha=1;if(!gameStarted||gameOver){ctx.font='bold 40px Courier New';ctx.textAlign='center';ctx.fillStyle='#0fa';ctx.shadowColor='#0fa';ctx.shadowBlur=20;ctx.fillText('TETRIS',w/2,h/2-20);ctx.shadowBlur=0;ctx.font='14px Courier New';ctx.fillStyle='#8cc';ctx.fillText('Press SPACE to start',w/2,h/2+20);ctx.restore();drawNextPiece();return;}ctx.fillStyle='rgba(0,20,30,0.6)';ctx.fillRect(offX,offY,cellW*COLS,cellH*ROWS);ctx.strokeStyle='rgba(0,255,170,0.08)';ctx.lineWidth=0.5;for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(offX+x*cellW,offY);ctx.lineTo(offX+x*cellW,offY+cellH*ROWS);ctx.stroke();}for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(offX,offY+y*cellH);ctx.lineTo(offX+cellW*COLS,offY+y*cellH);ctx.stroke();}for(let y=0;y<ROWS;y++){for(let x=0;x<COLS;x++){const isClearing=lineClearRows.includes(y);if(isClearing){const flash=Math.sin(lineClearTimer*0.8)*0.5+0.5;ctx.globalAlpha=flash;ctx.fillStyle='#fff';ctx.fillRect(offX+x*cellW+1,offY+y*cellH+1,cellW-2,cellH-2);ctx.globalAlpha=1;}else if(board[y][x]){drawBlock(offX+x*cellW,offY+y*cellH,cellW,cellH,board[y][x]);}}}if(cur){const gy=ghostY();if(gy!==cur.y){for(const[cx,cy]of cur.cells){const x=cx+cur.x,y=cy+gy;if(y>=0){ctx.globalAlpha=0.15;ctx.fillStyle=cur.color;ctx.fillRect(offX+x*cellW+1,offY+y*cellH+1,cellW-2,cellH-2);ctx.globalAlpha=1;}}}for(const[cx,cy]of cur.cells){const x=cx+cur.x,y=cy+cur.y;if(y>=0)drawBlock(offX+x*cellW,offY+y*cellH,cellW,cellH,cur.color);}}ctx.strokeStyle='#0fa';ctx.shadowColor='#0fa';ctx.shadowBlur=8;ctx.lineWidth=2;ctx.strokeRect(offX,offY,cellW*COLS,cellH*ROWS);ctx.shadowBlur=0;if(paused){ctx.fillStyle='rgba(0,0,20,0.6)';ctx.fillRect(offX,offY,cellW*COLS,cellH*ROWS);ctx.font='bold 28px Courier New';ctx.textAlign='center';ctx.fillStyle='#0fa';ctx.shadowColor='#0fa';ctx.shadowBlur=12;ctx.fillText('PAUSED',offX+cellW*COLS/2,offY+cellH*ROWS/2);ctx.shadowBlur=0;}ctx.restore();drawNextPiece();}function drawBlock(x,y,w,h,color){ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=6;ctx.fillRect(x+1,y+1,w-2,h-2);ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,0.25)';ctx.fillRect(x+2,y+2,w-4,h*0.3);ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fillRect(x+2,y+h*0.7,w-4,h*0.28);}function drawNextPiece(){const cw=nCanvas.width,ch=nCanvas.height;nCtx.clearRect(0,0,cw,ch);nCtx.fillStyle='rgba(0,15,20,0.8)';nCtx.fillRect(0,0,cw,ch);if(!next)return;const cellSize=20;let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;next.cells.forEach(c=>{minX=Math.min(minX,c[0]);maxX=Math.max(maxX,c[0]);minY=Math.min(minY,c[1]);maxY=Math.max(maxY,c[1]);});const pw=(maxX-minX+1)*cellSize;const ph=(maxY-minY+1)*cellSize;const ox=(cw-pw)/2-minX*cellSize;const oy=(ch-ph)/2-minY*cellSize;for(const[cx,cy]of next.cells){const x=ox+cx*cellSize,y=oy+cy*cellSize;nCtx.fillStyle=next.color;nCtx.shadowColor=next.color;nCtx.shadowBlur=4;nCtx.fillRect(x+1,y+1,cellSize-2,cellSize-2);nCtx.shadowBlur=0;nCtx.fillStyle='rgba(255,255,255,0.2)';nCtx.fillRect(x+2,y+2,cellSize-4,cellSize*0.3);}nCtx.strokeStyle='rgba(0,255,170,0.3)';nCtx.lineWidth=1;nCtx.strokeRect(0,0,cw,ch);}function hud(){document.getElementById('uScore').textContent=score;document.getElementById('uHi').textContent=hiScore;document.getElementById('uLevel').textContent=level;document.getElementById('uLines').textContent=totalLines;}function showMsg(html){document.getElementById('msgBox').innerHTML=html;document.getElementById('overlay').style.display='flex';}function hideMsg(){document.getElementById('overlay').style.display='none';}function loop(time){const dt=lastTime?time-lastTime:16;lastTime=time;update(dt);draw();requestAnimationFrame(loop);}loop(0);</script></body></html>
