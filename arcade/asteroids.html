<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ASTEROIDS — Deep Space Edition</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Courier New',monospace;}canvas{display:block;}#crt{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;background:repeating-linear-gradient(0deg,rgba(0,0,0,0.1) 0px,rgba(0,0,0,0.1) 1px,transparent 1px,transparent 3px);}#crt::after{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,0.4) 100%);}#hud{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:20px;z-index:5;color:#0fa;font-size:13px;font-weight:bold;text-shadow:0 0 10px #0fa;letter-spacing:1px;}#hud span{background:rgba(0,0,10,0.7);padding:5px 12px;border-radius:4px;}#lives-panel{position:absolute;left:16px;bottom:16px;z-index:5;text-align:left;}#lives-panel .title{color:#0fa;font-size:11px;text-shadow:0 0 6px #0fa;}#lives-icons{display:flex;gap:3px;margin-top:4px;}.life-icon{width:20px;height:14px;}#overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;z-index:20;pointer-events:none;}#overlay>div{background:rgba(0,5,15,0.94);border:2px solid #0fa;border-radius:8px;padding:32px 48px;text-align:center;color:#0fa;text-shadow:0 0 8px #0fa;max-width:540px;box-shadow:0 0 60px rgba(0,255,170,0.12);}#overlay h2{font-size:32px;margin-bottom:4px;letter-spacing:4px;}#overlay h3{font-size:15px;margin:12px 0 6px;color:#0fa;letter-spacing:2px;}#overlay p{font-size:13px;margin:4px 0;color:#8cc;line-height:1.5;}.c-yellow{color:#ff0 !important;text-shadow:0 0 6px #ff0 !important;}.c-green{color:#0f0 !important;}.c-red{color:#f44 !important;text-shadow:0 0 6px #f44 !important;}.c-cyan{color:#0fa !important;}.c-amber{color:#fa0 !important;}.c-white{color:#fff !important;}</style></head><body><div id="crt"></div><div id="hud"><span id="uScore">SCORE: 0</span><span id="uHi">HI: 0</span><span id="uWave">WAVE 1</span><span id="uAsteroids">0</span></div><div id="lives-panel"><div class="title">LIVES</div><div id="lives-icons"></div></div><canvas id="c"></canvas><div id="overlay"><div id="msgBox"><h2>🪨 ASTEROIDS</h2><p class="c-cyan" style="font-size:15px; margin:4px 0;">DEEP SPACE EDITION</p><h3>CONTROLS</h3><p><span class="c-yellow">← →</span> Rotate &nbsp; <span class="c-yellow">↑</span> Thrust &nbsp; <span class="c-yellow">SPACE</span> Fire &nbsp; <span class="c-yellow">↓</span> Brake</p><h3>SCORING</h3><p><span class="c-amber">LARGE</span> 20pts &nbsp; <span class="c-yellow">MEDIUM</span> 50pts &nbsp; <span class="c-green">SMALL</span> 100pts</p><p>Destroy all asteroids to advance — they get faster each wave!</p><p style="margin-top:14px;">Press <span class="c-yellow">SPACE</span> to start</p></div></div><script>const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');function resize(){canvas.width=Math.min(window.innerWidth-100,900);canvas.height=Math.min(window.innerHeight-20,680);canvas.width=Math.max(500,canvas.width);canvas.height=Math.max(420,canvas.height);}resize();window.addEventListener('resize',resize);let audioCtx;function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}function playSound(type){ensureAudio();const ac=audioCtx,now=ac.currentTime;try{switch(type){case 'shoot':{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.setValueAtTime(1200,now);o.frequency.exponentialRampToValueAtTime(200,now+0.08);g.gain.setValueAtTime(0.1,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.08);o.connect(g).connect(ac.destination);o.start(now);o.stop(now+0.08);break;}case 'explosion':{const buf=ac.createBuffer(1,ac.sampleRate*0.3,ac.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();s.buffer=buf;f.type='lowpass';f.frequency.setValueAtTime(600,now);f.frequency.exponentialRampToValueAtTime(40,now+0.3);g.gain.setValueAtTime(0.25,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.3);s.connect(f).connect(g).connect(ac.destination);s.start(now);s.stop(now+0.3);break;}case 'bigExplosion':{const buf=ac.createBuffer(1,ac.sampleRate*0.5,ac.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5);const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();s.buffer=buf;f.type='lowpass';f.frequency.setValueAtTime(400,now);f.frequency.exponentialRampToValueAtTime(20,now+0.5);g.gain.setValueAtTime(0.35,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.5);s.connect(f).connect(g).connect(ac.destination);s.start(now);s.stop(now+0.5);break;}case 'thrust':{const buf=ac.createBuffer(1,ac.sampleRate*0.1,ac.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.3;const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();s.buffer=buf;f.type='lowpass';f.frequency.value=200;g.gain.setValueAtTime(0.05,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.1);s.connect(f).connect(g).connect(ac.destination);s.start(now);s.stop(now+0.1);break;}case 'hit':{const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(150,now);o.frequency.exponentialRampToValueAtTime(30,now+0.4);g.gain.setValueAtTime(0.3,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.4);o.connect(g).connect(ac.destination);o.start(now);o.stop(now+0.4);break;}case 'wave':{[440,554,659,880].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.12,now+i*0.08);g.gain.exponentialRampToValueAtTime(0.001,now+i*0.08+0.12);o.connect(g).connect(ac.destination);o.start(now+i*0.08);o.stop(now+i*0.08+0.12);});break;}case 'invuln':{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(0.06,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.03);o.connect(g).connect(ac.destination);o.start(now);o.stop(now+0.03);break;}}}catch(e){}}const W=()=>canvas.width;const H=()=>canvas.height;const PI2=Math.PI*2;const AST_SIZES={large:40,medium:22,small:12};const AST_SPEEDS={large:1.2,medium:2.2,small:3.2};const AST_SCORES={large:20,medium:50,small:100};const AST_INIT_COUNTS=[4,5,6,7,8,9,10,11];function R(a,b){return a+Math.random()*(b-a);}function wrap(v,lo,hi){while(v<lo)v+=hi-lo;while(v>=hi)v-=hi-lo;return v;}function dist(a,b){return Math.hypot(b.x-a.x,b.y-a.y);}let stars=[];function initStars(){stars=[];for(let i=0;i<120;i++)stars.push({x:R(0,W()),y:R(0,H()),r:R(0.3,1.2),s:R(0.1,1.2),p:R(0,6.28)});}initStars();function tickStars(){stars.forEach(s=>{s.y+=s.s;s.p+=0.015;if(s.y>H()+5){s.y=-5;s.x=R(0,W());}});}let keys={};let ship=null;let bullets=[],asteroids=[],particles=[];let score=0,hiScore=parseInt(localStorage.getItem('ast_hi')||'0');let wave=0,lives=3;let gameOver=false,gameStarted=false;let wavePhase='none',waveTimer=0;let shakeT=0,shakeI=0;let thrustFlash=0;function initShip(){return{x:W()/2,y:H()/2,vx:0,vy:0,angle:-Math.PI/2,alive:true,flash:180,cd:0,radius:12};}function makeAsteroid(size,x,y){const speedMult=1+(wave-1)*0.12;const baseSpeed=AST_SPEEDS[size]*speedMult;const a=R(0,PI2);const sp=R(baseSpeed*0.6,baseSpeed*1.4);const verts=[];const n=8+Math.floor(R(0,5));const r=AST_SIZES[size];for(let i=0;i<n;i++){const ang=(i/n)*PI2;const vr=r*R(0.65,1.0);verts.push({x:Math.cos(ang)*vr,y:Math.sin(ang)*vr});}return{x:x!==undefined?x:R(40,W()-40),y:y!==undefined?y:R(40,H()-40),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,size:size,r:r,verts:verts,rot:R(-0.02,0.02),angle:0};}function nextWave(){wave++;wavePhase='enter';waveTimer=120;asteroids=[];const count=Math.min(AST_INIT_COUNTS[Math.floor((wave-1)/2)],12);for(let i=0;i<count;i++){asteroids.push(makeAsteroid('large'));}playSound('wave');hud();}function shipFire(){if(!ship||!ship.alive||ship.cd>0)return;ship.cd=8;const sp=9;bullets.push({x:ship.x+Math.cos(ship.angle)*16,y:ship.y+Math.sin(ship.angle)*16,vx:Math.cos(ship.angle)*sp+ship.vx*0.3,vy:Math.sin(ship.angle)*sp+ship.vy*0.3,life:60});playSound('shoot');}function explodeAsteroid(a){score+=AST_SCORES[a.size];shakeT=6;shakeI=a.size==='large'?5:a.size==='medium'?3:2;playSound(a.size==='large'?'bigExplosion':'explosion');const n=a.size==='large'?18:a.size==='medium'?10:5;for(let i=0;i<n;i++){const ang=R(0,PI2);const sp=R(1,4);particles.push({x:a.x,y:a.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:R(1,a.size==='large'?3:2),life:R(20,40),max:40,c:a.size==='small'?'#0f0':a.size==='medium'?'#fa0':'#ccc'});}if(a.size==='large'){for(let i=0;i<2;i++)asteroids.push(makeAsteroid('medium',a.x,a.y));}else if(a.size==='medium'){for(let i=0;i<3;i++)asteroids.push(makeAsteroid('small',a.x,a.y));}}function hitShip(){if(!ship||!ship.alive||ship.flash>0)return;ship.alive=false;ship.flash=60;lives--;shakeT=20;shakeI=8;playSound('hit');for(let i=0;i<20;i++){const ang=R(0,PI2);const sp=R(1,5);particles.push({x:ship.x,y:ship.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:R(1,3),life:R(15,35),max:35,c:'#0fa'});}if(lives<=0||asteroids.length===0){if(lives<=0&&asteroids.length===0){gameOver=true;if(score>hiScore){hiScore=score;localStorage.setItem('ast_hi',score);}setTimeout(()=>showMsg(`<h2 class="c-red">GAME OVER</h2><p>Score:<span class="c-yellow">${score}</span></p><p>Wave:${wave}</p><p>High:<span class="c-cyan">${hiScore}</span></p><p style="margin-top:12px;">Press<span class="c-yellow">SPACE</span>to retry</p>`),600);}}if(lives>0){setTimeout(()=>{if(!gameOver){ship=initShip();playSound('invuln');}},1500);}else if(asteroids.length>0){gameOver=true;if(score>hiScore){hiScore=score;localStorage.setItem('ast_hi',score);}setTimeout(()=>showMsg(`<h2 class="c-red">GAME OVER</h2><p>Score:<span class="c-yellow">${score}</span></p><p>Wave:${wave}</p><p>High:<span class="c-cyan">${hiScore}</span></p><p style="margin-top:12px;">Press<span class="c-yellow">SPACE</span>to retry</p>`),600);}}function collide(){if(!ship)return;bullets=bullets.filter(b=>{let hit=false;for(let i=asteroids.length-1;i>=0;i--){const a=asteroids[i];if(dist(b,a)<a.r+3){explodeAsteroid(a);asteroids.splice(i,1);hit=true;break;}}return!hit&&b.life>0;});if(ship.alive&&ship.flash<=0){for(const a of asteroids){if(dist(ship,a)<ship.radius+a.r-4){hitShip();break;}}}}function initGame(){score=0;wave=0;lives=3;gameOver=false;gameStarted=true;ship=initShip();bullets=[];asteroids=[];particles=[];wavePhase='none';waveTimer=0;shakeT=0;shakeI=0;nextWave();hideMsg();hud();}function update(){if(!gameStarted||gameOver){tickStars();return;}tickStars();if(wavePhase==='enter'){waveTimer--;if(waveTimer<=0)wavePhase='play';}if(ship&&ship.alive&&ship.flash<=0){if(keys['ArrowLeft'])ship.angle-=0.07;if(keys['ArrowRight'])ship.angle+=0.07;if(keys['ArrowUp']){ship.vx+=Math.cos(ship.angle)*0.15;ship.vy+=Math.sin(ship.angle)*0.15;thrustFlash=3;if(thrustFlash===3)playSound('thrust');}if(keys['ArrowDown']){ship.vx*=0.97;ship.vy*=0.97;}const spd=Math.hypot(ship.vx,ship.vy);if(spd>7){ship.vx=(ship.vx/spd)*7;ship.vy=(ship.vy/spd)*7;}ship.vx*=0.995;ship.vy*=0.995;ship.x=wrap(ship.x+ship.vx,0,W());ship.y=wrap(ship.y+ship.vy,0,H());if(keys[' '])shipFire();}if(ship&&ship.flash>0)ship.flash--;if(ship&&ship.cd>0)ship.cd--;if(thrustFlash>0)thrustFlash--;bullets.forEach(b=>{b.x=wrap(b.x+b.vx,0,W());b.y=wrap(b.y+b.vy,0,H());b.life--;});bullets=bullets.filter(b=>b.life>0);asteroids.forEach(a=>{a.x=wrap(a.x+a.vx,0,W());a.y=wrap(a.y+a.vy,0,H());a.angle+=a.rot;});particles.forEach(p=>{p.x=wrap(p.x+p.vx,0,W());p.y=wrap(p.y+p.vy,0,H());p.vx*=0.96;p.vy*=0.96;p.life--;});particles=particles.filter(p=>p.life>0);if(shakeT>0)shakeT--;if(wavePhase==='play')collide();if(wavePhase==='play'&&asteroids.length===0){wavePhase='done';waveTimer=60;if(lives<=0&&!gameOver){gameOver=true;if(score>hiScore){hiScore=score;localStorage.setItem('ast_hi',score);}setTimeout(()=>showMsg(`<h2 class="c-red">GAME OVER</h2><p>Score:<span class="c-yellow">${score}</span></p><p>Wave:${wave}</p><p>High:<span class="c-cyan">${hiScore}</span></p><p style="margin-top:12px;">Press<span class="c-yellow">SPACE</span>to retry</p>`),400);}}if(wavePhase==='done'){waveTimer--;if(waveTimer<=0)nextWave();}hud();}function draw(){const w=W(),h=H();ctx.save();if(shakeT>0)ctx.translate(Math.random()*shakeI-shakeI/2,Math.random()*shakeI-shakeI/2);const bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#020810');bg.addColorStop(0.5,'#051018');bg.addColorStop(1,'#081020');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);stars.forEach(s=>{ctx.globalAlpha=0.15+0.2*Math.sin(s.p);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,PI2);ctx.fill();});ctx.globalAlpha=1;if(!gameStarted||gameOver){ctx.font='bold 40px Courier New';ctx.textAlign='center';ctx.fillStyle='#0fa';ctx.shadowColor='#0fa';ctx.shadowBlur=20;ctx.fillText('ASTEROIDS',w/2,h/2-20);ctx.shadowBlur=0;ctx.font='14px Courier New';ctx.fillStyle='#8cc';ctx.fillText('Press SPACE to start',w/2,h/2+20);ctx.restore();return;}asteroids.forEach(a=>{ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.angle);ctx.strokeStyle=a.size==='small'?'#0f0':a.size==='medium'?'#fa0':'#ccc';ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=4;ctx.lineWidth=1.5;ctx.beginPath();a.verts.forEach((v,i)=>{if(i===0)ctx.moveTo(v.x,v.y);else ctx.lineTo(v.x,v.y);});ctx.closePath();ctx.stroke();ctx.shadowBlur=0;ctx.restore();});ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=4;bullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,2,0,PI2);ctx.fill();});ctx.shadowBlur=0;if(ship){if(ship.flash>0&&Math.floor(ship.flash/4)% 2===0)ctx.globalAlpha=0.2;ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(ship.angle);ctx.strokeStyle=ship.alive?'#0fa':'#f44';ctx.shadowColor='#0fa';ctx.shadowBlur=6;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(15,0);ctx.lineTo(-10,-9);ctx.lineTo(-6,0);ctx.lineTo(-10,9);ctx.closePath();ctx.stroke();if(ship.alive&&keys['ArrowUp']&&thrustFlash>0){ctx.strokeStyle='#f80';ctx.shadowColor='#f80';ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(-6,-3);ctx.lineTo(-12-Math.random()*8,0);ctx.lineTo(-6,3);ctx.stroke();}ctx.shadowBlur=0;ctx.restore();ctx.globalAlpha=1;}particles.forEach(p=>{ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.c;ctx.shadowColor=p.c;ctx.shadowBlur=3;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,PI2);ctx.fill();ctx.shadowBlur=0;});ctx.globalAlpha=1;if(wavePhase==='done'){ctx.globalAlpha=1-waveTimer/60;ctx.font='bold 24px Courier New';ctx.textAlign='center';ctx.fillStyle='#0fa';ctx.shadowColor='#0fa';ctx.shadowBlur=12;ctx.fillText('WAVE '+wave+' CLEARED',w/2,h/2);ctx.shadowBlur=0;ctx.globalAlpha=1;}ctx.restore();}function hud(){document.getElementById('uScore').textContent='SCORE:'+score;document.getElementById('uHi').textContent='HI:'+hiScore;document.getElementById('uWave').textContent='WAVE '+wave;document.getElementById('uAsteroids').textContent=asteroids.length+' ASTEROIDS';let h='';for(let i=0;i<3;i++){h+=i<lives?'<svg class="life-icon" viewBox="0 0 20 14"><polygon points="10,0 0,14 5,10 10,8 15,10 20,14" fill="#0fa"/></svg>':'<svg class="life-icon" viewBox="0 0 20 14"><polygon points="10,0 0,14 5,10 10,8 15,10 20,14" fill="#333"/></svg>';}document.getElementById('lives-icons').innerHTML=h;}function showMsg(html){document.getElementById('msgBox').innerHTML=html;document.getElementById('overlay').style.display='flex';}function hideMsg(){document.getElementById('overlay').style.display='none';}window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();if(e.key===' '&&(!gameStarted||gameOver)){initGame();return;}});window.addEventListener('keyup',e=>{keys[e.key]=false;});function loop(){update();draw();requestAnimationFrame(loop);}loop();</script></body></html>
