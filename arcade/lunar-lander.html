<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Lunar Lander</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Courier New',monospace;}canvas{display:block;border:2px solid #333;}#ui{position:absolute;top:10px;left:50%;transform:translateX(-50%);color:#0f0;font-size:14px;display:flex;gap:30px;pointer-events:none;text-shadow:0 0 6px #0f0;}#overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;pointer-events:none;}#overlay>div{background:rgba(0,0,0,0.85);border:2px solid #0f0;padding:30px 50px;text-align:center;color:#0f0;font-family:'Courier New',monospace;text-shadow:0 0 8px #0f0;}#overlay h2{font-size:28px;margin-bottom:10px;}#overlay p{font-size:14px;margin:6px 0;color:#aaa;}#overlay .good{color:#0f0;}#overlay .bad{color:#f44;}#overlay .key{color:#ff0;}</style></head><body><div id="ui"><span id="uAlt">ALT: 0</span><span id="uVel">VEL: 0</span><span id="uFuel">FUEL: 100%</span><span id="uScore">SCORE: 0</span></div><canvas id="c"></canvas><div id="overlay"><div id="msgBox"><h2>🚀 LUNAR LANDER</h2><p class="key">↑ THROTTLE &nbsp; ← → ROTATE</p><p class="key">SPACE = RESTART</p><p>Land on the green pad safely!</p><p>Vertical speed must be under 1.5 m/s</p><p class="key" style="margin-top:16px; color:#0f0;">Press SPACE to launch</p></div></div><script>const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');function resize(){const s=Math.min(window.innerWidth-20,window.innerHeight-20,900);canvas.width=Math.max(600,s);canvas.height=Math.max(500,s);}resize();window.addEventListener('resize',()=>{resize();if(terrain)generateTerrain();});const GRAVITY=0.025;const THRUST_POWER=0.065;const ROTATE_SPEED=0.045;const MAX_LAND_SPEED=1.5;const MAX_TILT=0.45;const FUEL_PER_TICK=0.08;const TOTAL_FUEL=200;const PAD_WIDTH_FRAC=0.10;let lander,terrain,stars,gameOver,landed,crashX,crashY,explosionParticles,score,padX,padW;let keys={};function makeStars(){stars=[];for(let i=0;i<300;i++){stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height*0.7,r:Math.random()*1.5+0.3,b:Math.random()*0.5+0.5});}}function generateTerrain(){const w=canvas.width;const h=canvas.height;const baseY=h*0.72;padW=w*PAD_WIDTH_FRAC;padX=w*0.3+Math.random()*w*0.35;terrain=[];const steps=120;const segW=w/steps;const padStartSeg=Math.floor(padX/segW);const padEndSeg=padStartSeg+Math.ceil(padW/segW);let points=[];let y=baseY;for(let i=0;i<=steps;i++){const x=i*segW;if(i>=padStartSeg&&i<=padEndSeg){y=baseY;}else{y+=(Math.random()-0.5)*18;y=Math.max(baseY*0.55,Math.min(baseY+60,y));}points.push({x,y});}for(let pass=0;pass<3;pass++){const pts=[points[0]];for(let i=1;i<points.length-1;i++){pts.push({x:points[i].x,y:(points[i-1].y+points[i].y*2+points[i+1].y)/4});}pts.push(points[points.length-1]);for(let i=padStartSeg;i<=padEndSeg;i++)pts[i].y=baseY;points=pts;}terrain=points;}function initGame(){lander={x:canvas.width/2,y:canvas.height*0.15,vx:(Math.random()-0.5)*0.6,vy:0,angle:0,fuel:TOTAL_FUEL,alive:true};gameOver=false;landed=false;explosionParticles=null;crashX=crashY=0;score=0;generateTerrain();makeStars();hideMessage();}let exhaustParticles=[];function spawnExhaust(){const cos=Math.cos(lander.angle);const sin=Math.sin(lander.angle);const noseX=lander.x+sin*18;const noseY=lander.y-cos*18;const ex=lander.x-sin*14;const ey=lander.y+cos*14;for(let i=0;i<3;i++){exhaustParticles.push({x:ex+(Math.random()-0.5)*6,y:ey+(Math.random()-0.5)*6,vx:-sin*(1.5+Math.random()*2)+(Math.random()-0.5)*0.8,vy:cos*(1.5+Math.random()*2)+(Math.random()-0.5)*0.8,life:20+Math.random()*20,maxLife:40,r:2+Math.random()*3});}}function spawnExplosion(x,y){explosionParticles=[];for(let i=0;i<80;i++){const angle=Math.random()*Math.PI*2;const speed=1+Math.random()*5;explosionParticles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:40+Math.random()*60,maxLife:100,r:1+Math.random()*4,color:Math.random()<0.5?'#f40':(Math.random()<0.5?'#ff0':'#f80')});}}function update(){if(gameOver||landed){if(explosionParticles){explosionParticles=explosionParticles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.04;p.life--;return p.life>0;});}return;}const thr=keys['ArrowUp'];if(keys['ArrowLeft'])lander.angle-=ROTATE_SPEED;if(keys['ArrowRight'])lander.angle+=ROTATE_SPEED;lander.angle=Math.max(-Math.PI/2.2,Math.min(Math.PI/2.2,lander.angle));if(thr&&lander.fuel>0){lander.vx+=Math.sin(lander.angle)*THRUST_POWER;lander.vy-=Math.cos(lander.angle)*THRUST_POWER;lander.fuel=Math.max(0,lander.fuel-FUEL_PER_TICK);spawnExhaust();}lander.vy+=GRAVITY;lander.x+=lander.vx;lander.y+=lander.vy;exhaustParticles=exhaustParticles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0;});if(lander.x<-15)lander.x=canvas.width+15;if(lander.x>canvas.width+15)lander.x=-15;const terrainHit=checkTerrainCollision(lander.x,lander.y+16);if(terrainHit){const onPad=lander.x>=padX-padW/2&&lander.x<=padX+padW/2;if(onPad&&Math.abs(lander.vy)<MAX_LAND_SPEED&&Math.abs(lander.angle)<MAX_TILT){lander.vy=0;lander.vx=0;lander.y=padY()-16;lander.angle=0;landed=true;score=Math.round(lander.fuel*10+500);showMessage(`<h2 class="good">🎉 SAFE LANDING!</h2><p>Fuel remaining:<span class="good">${Math.round(lander.fuel)}</span></p><p>Score:<span class="good">${score}</span></p><p class="key" style="margin-top:14px;">Press SPACE to play again</p>`);}else{crash(lander.x,lander.y);}return;}if(lander.y>canvas.height+50){crash(lander.x,canvas.height);}const alt=Math.max(0,padY()-lander.y-16);const vel=Math.sqrt(lander.vx*lander.vx+lander.vy*lander.vy);document.getElementById('uAlt').textContent=`ALT:${Math.round(alt)}`;document.getElementById('uVel').textContent=`VEL:${vel.toFixed(1)}m/s`;document.getElementById('uFuel').textContent=`FUEL:${Math.round(lander.fuel)}%`;document.getElementById('uScore').textContent=`SCORE:${score}`;}function padY(){for(let i=0;i<terrain.length-1;i++){if(terrain[i].x>=padX-padW/2&&terrain[i].x<=padX+padW/2){return terrain[i].y;}}return canvas.height*0.72;}function checkTerrainCollision(x,y){for(let i=0;i<terrain.length-1;i++){const p1=terrain[i],p2=terrain[i+1];if(x>=p1.x&&x<=p2.x){const t=(x-p1.x)/(p2.x-p1.x);const ty=p1.y+t*(p2.y-p1.y);return y>=ty;}}return false;}function crash(x,y){lander.alive=false;gameOver=true;crashX=x;crashY=y;spawnExplosion(x,y);const reason=Math.abs(lander.vy)>=MAX_LAND_SPEED?'Too fast!':Math.abs(lander.angle)>=MAX_TILT?'Too tilted!':'Not on pad!';showMessage(`<h2 class="bad">💥 CRASH!</h2><p>${reason}</p><p>Vertical speed:${lander.vy.toFixed(1)}m/s</p><p class="key" style="margin-top:14px;">Press SPACE to try again</p>`);}function draw(){const w=canvas.width,h=canvas.height;const skyGrad=ctx.createLinearGradient(0,0,0,h);skyGrad.addColorStop(0,'#000010');skyGrad.addColorStop(1,'#0a0a20');ctx.fillStyle=skyGrad;ctx.fillRect(0,0,w,h);for(const s of stars){ctx.globalAlpha=s.b;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;if(terrain){ctx.beginPath();ctx.moveTo(terrain[0].x,terrain[0].y);for(let i=1;i<terrain.length;i++)ctx.lineTo(terrain[i].x,terrain[i].y);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();const tGrad=ctx.createLinearGradient(0,h*0.5,0,h);tGrad.addColorStop(0,'#555');tGrad.addColorStop(1,'#222');ctx.fillStyle=tGrad;ctx.fill();ctx.strokeStyle='#888';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(terrain[0].x,terrain[0].y);for(let i=1;i<terrain.length;i++)ctx.lineTo(terrain[i].x,terrain[i].y);ctx.stroke();const padTopY=padY();ctx.fillStyle='#0f0';ctx.shadowColor='#0f0';ctx.shadowBlur=12;ctx.fillRect(padX-padW/2,padTopY-4,padW,8);ctx.shadowBlur=0;ctx.fillStyle='#0f0';ctx.font='11px Courier New';ctx.textAlign='center';ctx.fillText('PAD',padX,padTopY-8);}for(const p of exhaustParticles){const alpha=p.life/p.maxLife;ctx.globalAlpha=alpha;ctx.fillStyle=p.life>p.maxLife*0.5?'#f80':'#f50';ctx.beginPath();ctx.arc(p.x,p.y,p.r*alpha,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;if(explosionParticles){for(const p of explosionParticles){const alpha=p.life/p.maxLife;ctx.globalAlpha=alpha;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r*alpha,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}if(lander.alive){drawLander(lander.x,lander.y,lander.angle);}}function drawLander(x,y,angle){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.strokeStyle='#ccc';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-10,5);ctx.lineTo(-14,16);ctx.moveTo(10,5);ctx.lineTo(14,16);ctx.moveTo(-17,16);ctx.lineTo(-11,16);ctx.moveTo(11,16);ctx.lineTo(17,16);ctx.stroke();ctx.fillStyle='#ddd';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(-12,8);ctx.lineTo(-8,12);ctx.lineTo(8,12);ctx.lineTo(12,8);ctx.closePath();ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#4af';ctx.beginPath();ctx.arc(0,-6,4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#8cf';ctx.lineWidth=1;ctx.stroke();if(keys['ArrowUp']&&lander.fuel>0){const flameH=12+Math.random()*10;const grad=ctx.createLinearGradient(0,12,0,12+flameH);grad.addColorStop(0,'#fff');grad.addColorStop(0.3,'#ff0');grad.addColorStop(0.7,'#f80');grad.addColorStop(1,'transparent');ctx.fillStyle=grad;ctx.beginPath();ctx.moveTo(-5,12);ctx.lineTo(0,12+flameH);ctx.lineTo(5,12);ctx.closePath();ctx.fill();}ctx.restore();}function showMessage(html){const box=document.getElementById('msgBox');box.innerHTML=html;document.getElementById('overlay').style.display='flex';}function hideMessage(){document.getElementById('overlay').style.display='none';}function loop(){update();draw();requestAnimationFrame(loop);}window.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '||e.key==='ArrowUp'||e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();}if(e.key===' '){if(gameOver||landed){initGame();}}});window.addEventListener('keyup',e=>{keys[e.key]=false;});initGame();landed=true;gameOver=true;messageShown=true;showMessage(`<h2>🚀 LUNAR LANDER</h2><p class="key">↑ THROTTLE&nbsp;&nbsp;← → ROTATE</p><p class="key" style="margin-top:6px;">SPACE=RESTART</p><p style="margin:8px 0;">Land on the<span style="color:#0f0">GREEN PAD</span>safely!</p><p>Vertical speed must be under<span style="color:#ff0">1.5 m/s</span></p><p>Tilt must be under<span style="color:#ff0">25°</span></p><p class="key" style="margin-top:16px;color:#0f0;">Press SPACE to launch</p>`);loop();</script></body></html>
